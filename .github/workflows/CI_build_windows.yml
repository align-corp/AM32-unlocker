name: CI Build Windows

on: [push, pull_request]

jobs:
  build:
    runs-on: 'windows-latest'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: install dependencies
        run: |
             python3 -m pip install pyinstaller setuptools tk intelhex

      - name: Build CI
        run: |
             python3 package/build.py
             Move-Item esc_unlocker_windows.exe AM32_ESC_flasher_Align.exe

      - name: Archive build
        uses: actions/upload-artifact@v7
        with:
          name: ESC unlocker windows
          path: |
            AM32_ESC_flasher_Align.exe
          retention-days: 7

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ESC unlocker windows
          path: build

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes "Automated release for ${{ github.ref_name }}" \
            build/AM32_ESC_flasher_Align.exe
