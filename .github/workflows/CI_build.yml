name: CI Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up Python
        if: runner.os == 'macOS'
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: python3 -m pip install pyinstaller setuptools tk intelhex

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python-tk
          python3 -m pip install pyinstaller setuptools intelhex

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y python3-tk
          python3 -m pip install pyinstaller setuptools intelhex

      - name: Build CI
        run: python3 package/build.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Move-Item esc_unlocker_windows.exe Align_flash_tool.exe
          Compress-Archive -Path Align_flash_tool.exe -DestinationPath Align_flash_tool_${{ matrix.os }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: zip Align_flash_tool_${{ matrix.os }}.zip esc_unlocker_linux

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: zip Align_flash_tool_${{ matrix.os }}.zip esc_unlocker_macos

      - name: Archive build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: Align_flash_tool_${{ matrix.os }}.zip
          retention-days: 7

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: build
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes "Automated release for ${{ github.ref_name }}" \
            build/*
